name: Deploy PVE

on:
  push:
    branches: [main]
    paths:
      - 'pve/**'
      - 'ansible.cfg'
      - '.forgejo/workflows/pve.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet --break-system-packages ansible-core proxmoxer requests

      - name: Write vault password
        run: echo "${{ secrets.VAULT_PASS }}" > vault-pass

      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r pve/ansible/requirements.yml

      - name: Run playbook
        run: ansible-playbook -i pve/ansible/inventory.ini pve/ansible/site.yml
