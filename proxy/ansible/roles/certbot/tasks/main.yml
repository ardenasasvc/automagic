---
- name: Install certbot via snap
  community.general.snap:
    name: certbot
    classic: true
    state: present

- name: Symlink certbot to /usr/bin
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link

- name: Obtain TLS certificate (run once - skip if cert already exists)
  ansible.builtin.command: >
    certbot --nginx
    -d {{ certbot_domain }}
    -d arden.social
    --non-interactive
    --agree-tos
    --email {{ certbot_email }}
  args:
    creates: /etc/letsencrypt/live/{{ certbot_domain }}/fullchain.pem
  notify: reload nginx

- name: Set up certbot auto-renewal cron
  ansible.builtin.cron:
    name: certbot renew
    minute: "0"
    hour: "0,12"
    job: "certbot renew --quiet"
    user: root
